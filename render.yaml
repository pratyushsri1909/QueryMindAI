services:
  - type: web
    name: querymind-ai
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: QUERYMIND_MODE
        value: database
      - key: DATABASE_URL
        sync: false
      - key: DB_STATEMENT_TIMEOUT_MS
        value: "5000"
      - key: DB_CONNECT_TIMEOUT
        value: "10"
      - key: CORS_ORIGINS
        value: https://querymind-ai.vercel.app

